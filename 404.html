<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found — Ankit Surana</title>
<meta name="robots" content="noindex">
<style>
  :root{--bg:#0a0a0b;--ink:#f4f4f6;--ink-2:#a2a2ab;--ink-3:#66666f;--line:#232327;color-scheme:dark;}
  @media (prefers-color-scheme: light){:root{--bg:#fff;--ink:#16161a;--ink-2:#4d4d55;--ink-3:#8a8a92;--line:#e7e7ea;color-scheme:light;}}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       -webkit-font-smoothing:antialiased;letter-spacing:-.01em;padding:28px;}
  .wrap{max-width:420px;}
  p.code{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:12px;letter-spacing:.14em;
         text-transform:uppercase;color:var(--ink-3);margin:0 0 20px;}
  h1{font-size:34px;line-height:1.1;letter-spacing:-.04em;font-weight:640;margin:0 0 16px;}
  p.sub{font-size:17px;color:var(--ink-2);line-height:1.6;margin:0 0 30px;}
  a{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:550;padding:9px 16px;
    border-radius:999px;background:var(--ink);color:var(--bg);text-decoration:none;
    transition:transform 140ms cubic-bezier(0.22,1,0.36,1);}
  a:active{transform:scale(0.97);}
</style>
</head>
<body>
  <div class="wrap">
    <p class="code">404</p>
    <h1>This page does not exist.</h1>
    <p class="sub">Either I moved it or you followed a link I broke. The second one is more likely.</p>
    <a href="/">Back to the site</a>
  </div>
</body>
</html>

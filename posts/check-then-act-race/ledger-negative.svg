<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" role="img" aria-label="A credit ledger table where two concurrent charges drive the balance to minus one">
  <style>
    /* var() picks up the page theme when this file is inlined; the fallback
       keeps it readable when the .svg is opened on its own. */
    .bg{fill:var(--diagram-bg,#0d1117)} .panel{fill:var(--diagram-panel,#161b22)}
    .panel2{fill:var(--diagram-panel2,#1c2128)}
    .ln{stroke:var(--diagram-line,#30363d);fill:none}
    .t{fill:var(--diagram-ink,#e6edf3)} .m{fill:var(--diagram-ink2,#8b949e)}
    .dim{fill:var(--diagram-ink3,#6e7681)}
    .acc{fill:var(--diagram-acc,#8ab4f8)} .accs{stroke:var(--diagram-acc,#8ab4f8);fill:none}
    .bad{fill:var(--diagram-bad,#f85149)} .bads{stroke:var(--diagram-bad,#f85149);fill:none}
    .ok{fill:var(--diagram-ok,#3fb950)} .oks{stroke:var(--diagram-ok,#3fb950);fill:none}
    .warn{fill:var(--diagram-warn,#f0883e)}
    text{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
    @media (prefers-color-scheme: light){
      .bg{fill:var(--diagram-bg,#f6f8fa)} .panel{fill:var(--diagram-panel,#ffffff)}
      .panel2{fill:var(--diagram-panel2,#f0f3f6)}
      .ln{stroke:var(--diagram-line,#d0d7de)}
      .t{fill:var(--diagram-ink,#1f2328)} .m{fill:var(--diagram-ink2,#59636e)}
      .dim{fill:var(--diagram-ink3,#818b98)}
      .acc{fill:var(--diagram-acc,#0969da)} .accs{stroke:var(--diagram-acc,#0969da)}
      .bad{fill:var(--diagram-bad,#cf222e)} .bads{stroke:var(--diagram-bad,#cf222e)}
      .ok{fill:var(--diagram-ok,#1a7f37)} .oks{stroke:var(--diagram-ok,#1a7f37)}
      .warn{fill:var(--diagram-warn,#bc4c00)}
    }
  </style>
  <rect class="bg" width="900" height="460"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">
    <text x="40" y="46" class="dim" font-size="12" letter-spacing="2">LEDGER — user 8814</text>

    <line x1="40" y1="66" x2="860" y2="66" class="ln" stroke-width="1"/>
    <g class="dim" font-size="12" letter-spacing="1.5">
      <text x="40" y="92">TS</text>
      <text x="230" y="92">REASON</text>
      <text x="500" y="92">DELTA</text>
      <text x="660" y="92">BALANCE</text>
    </g>
    <line x1="40" y1="108" x2="860" y2="108" class="ln" stroke-width="1"/>

    <g class="m">
      <text x="40" y="146">10:04:11.002</text><text x="230" y="146">topup</text>
      <text x="500" y="146" class="ok">+1</text><text x="660" y="146">1</text>
    </g>

    <rect x="32" y="170" width="836" height="46" class="acc" opacity="0.07" rx="6"/>
    <g class="m">
      <text x="40" y="200">10:19:52.418</text><text x="230" y="200">score  (request A)</text>
      <text x="500" y="200" class="warn">-1</text><text x="660" y="200">0</text>
    </g>

    <rect x="32" y="224" width="836" height="46" class="bad" opacity="0.1" rx="6"/>
    <g class="m">
      <text x="40" y="254">10:19:52.419</text><text x="230" y="254">score  (request B)</text>
      <text x="500" y="254" class="bad">-1</text>
      <text x="660" y="254" class="bad" font-weight="600">-1</text>
    </g>

    <line x1="40" y1="286" x2="860" y2="286" class="ln" stroke-width="1"/>

    <text x="40" y="326" class="bad" font-size="13">▲ one millisecond apart. both read balance = 1.</text>
    <text x="40" y="352" class="dim" font-size="13">  neither could see the other's charge, because neither had written it yet.</text>

    <rect x="40" y="382" width="820" height="46" rx="10" fill="none" class="ln"/>
    <text x="60" y="411" class="dim" font-size="13">balance = sum(delta) over ledger  →  the history survives, so the bug is readable</text>
  </g>
</svg>

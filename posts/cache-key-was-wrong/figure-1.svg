<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Hashing the raw scrape gives the same job two keys. Keying on the job id gives it one.">
  <style>
    /* var() picks up the page theme when this file is inlined; the fallback
       keeps it readable when the .svg is opened on its own. */
    .bg{fill:var(--diagram-bg,#0d1117)} .panel{fill:var(--diagram-panel,#161b22)}
    .panel2{fill:var(--diagram-panel2,#1c2128)}
    .ln{stroke:var(--diagram-line,#30363d);fill:none}
    .t{fill:var(--diagram-ink,#e6edf3)} .m{fill:var(--diagram-ink2,#8b949e)}
    .dim{fill:var(--diagram-ink3,#6e7681)}
    .acc{fill:var(--diagram-acc,#8ab4f8)} .accs{stroke:var(--diagram-acc,#8ab4f8);fill:none}
    .bad{fill:var(--diagram-bad,#f85149)} .bads{stroke:var(--diagram-bad,#f85149);fill:none}
    .ok{fill:var(--diagram-ok,#3fb950)} .oks{stroke:var(--diagram-ok,#3fb950);fill:none}
    .warn{fill:var(--diagram-warn,#f0883e)}
    text{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
    @media (prefers-color-scheme: light){
      .bg{fill:var(--diagram-bg,#f6f8fa)} .panel{fill:var(--diagram-panel,#ffffff)}
      .panel2{fill:var(--diagram-panel2,#f0f3f6)}
      .ln{stroke:var(--diagram-line,#d0d7de)}
      .t{fill:var(--diagram-ink,#1f2328)} .m{fill:var(--diagram-ink2,#59636e)}
      .dim{fill:var(--diagram-ink3,#818b98)}
      .acc{fill:var(--diagram-acc,#0969da)} .accs{stroke:var(--diagram-acc,#0969da)}
      .bad{fill:var(--diagram-bad,#cf222e)} .bads{stroke:var(--diagram-bad,#cf222e)}
      .ok{fill:var(--diagram-ok,#1a7f37)} .oks{stroke:var(--diagram-ok,#1a7f37)}
      .warn{fill:var(--diagram-warn,#bc4c00)}
    }
  </style>
  <rect class="bg" width="1200" height="675"/>

  <text class="sans t" x="60" y="70" font-size="30" font-weight="600">One job, two visits, and what the key hears</text>
  <text class="m" x="60" y="102" font-size="16">A hash cannot tell signal from noise. Whatever you put in the key becomes an input.</text>

  <!-- Left: hash the raw scrape -->
  <g>
    <rect class="panel ln" x="60" y="140" width="520" height="440" rx="14" stroke-width="1"/>
    <circle class="bad" cx="98" cy="186" r="7"/>
    <text class="t" x="120" y="193" font-size="18">key = sha256(raw scrape)</text>

    <rect class="panel2 ln" x="92" y="222" width="216" height="104" rx="10" stroke-width="1"/>
    <text class="m" x="110" y="250" font-size="13">visit 1</text>
    <text class="t" x="110" y="274" font-size="13">"...GCP,  Airflow"</text>
    <text class="dim" x="110" y="296" font-size="12">see-more collapsed</text>

    <rect class="panel2 ln" x="332" y="222" width="216" height="104" rx="10" stroke-width="1"/>
    <text class="m" x="350" y="250" font-size="13">visit 2</text>
    <text class="t" x="350" y="274" font-size="13">"...GCP, Airflow ."</text>
    <text class="dim" x="350" y="296" font-size="12">see-more expanded</text>

    <path class="bads" d="M200 326 v40" stroke-width="1.5"/>
    <path class="bad" d="M200 372 l-5 -9 h10 z"/>
    <path class="bads" d="M440 326 v40" stroke-width="1.5"/>
    <path class="bad" d="M440 372 l-5 -9 h10 z"/>

    <rect class="panel2 ln" x="92" y="382" width="216" height="56" rx="10" stroke-width="1"/>
    <text class="t" x="130" y="416" font-size="14">key 7f3a19...</text>
    <rect class="panel2 ln" x="332" y="382" width="216" height="56" rx="10" stroke-width="1"/>
    <text class="bad" x="370" y="416" font-size="14">key c81d40...</text>

    <rect class="panel2 bads" x="92" y="472" width="456" height="76" rx="10" stroke-width="1.5"/>
    <text class="bad" x="112" y="503" font-size="14">two keys for one question:</text>
    <text class="bad" x="112" y="527" font-size="14">cache miss, full re-run, second charge</text>
  </g>

  <!-- Right: key on job id -->
  <g>
    <rect class="panel ln" x="620" y="140" width="520" height="440" rx="14" stroke-width="1"/>
    <circle class="ok" cx="658" cy="186" r="7"/>
    <text class="t" x="680" y="193" font-size="18">key = jobid + resume fp</text>

    <rect class="panel2 ln" x="652" y="222" width="216" height="104" rx="10" stroke-width="1"/>
    <text class="m" x="670" y="250" font-size="13">visit 1</text>
    <text class="t" x="670" y="274" font-size="13">jobid:4021557763</text>
    <text class="dim" x="670" y="296" font-size="12">scrape ignored</text>

    <rect class="panel2 ln" x="892" y="222" width="216" height="104" rx="10" stroke-width="1"/>
    <text class="m" x="910" y="250" font-size="13">visit 2</text>
    <text class="t" x="910" y="274" font-size="13">jobid:4021557763</text>
    <text class="dim" x="910" y="296" font-size="12">scrape ignored</text>

    <path class="oks" d="M760 326 q0 46 108 54" stroke-width="1.5"/>
    <path class="oks" d="M1000 326 q0 46 -108 54" stroke-width="1.5"/>
    <path class="ok" d="M880 384 l-5 -9 h10 z"/>

    <rect class="panel2 oks" x="772" y="390" width="216" height="56" rx="10" stroke-width="2"/>
    <text class="ok" x="812" y="424" font-size="14">key 9b2ee4...</text>

    <rect class="panel2 ln" x="652" y="472" width="456" height="76" rx="10" stroke-width="1"/>
    <text class="ok" x="672" y="503" font-size="14">one key, one charge, cache hit on rescore</text>
    <text class="m" x="672" y="527" font-size="13">no id? hash the normalised words, never the rendering</text>
  </g>

  <text class="dim" x="60" y="622" font-size="14">The id names the job. The scrape is how we happened to read it today.</text>
  <text class="acc" x="60" y="650" font-size="14">Every extra thing in a key is a way for two identical questions to look different.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Sutham classifying a bottle on-device, plus how it handles hazardous items, low confidence and corrections">
  <style>
    /* var() picks up the page theme when this file is inlined; the fallback
       keeps it readable when the .svg is opened on its own. */
    .bg{fill:var(--diagram-bg,#0d1117)} .panel{fill:var(--diagram-panel,#161b22)}
    .panel2{fill:var(--diagram-panel2,#1c2128)}
    .ln{stroke:var(--diagram-line,#30363d);fill:none}
    .t{fill:var(--diagram-ink,#e6edf3)} .m{fill:var(--diagram-ink2,#8b949e)}
    .dim{fill:var(--diagram-ink3,#6e7681)}
    .acc{fill:var(--diagram-acc,#8ab4f8)} .accs{stroke:var(--diagram-acc,#8ab4f8);fill:none}
    .bad{fill:var(--diagram-bad,#f85149)} .bads{stroke:var(--diagram-bad,#f85149);fill:none}
    .ok{fill:var(--diagram-ok,#3fb950)} .oks{stroke:var(--diagram-ok,#3fb950);fill:none}
    .warn{fill:var(--diagram-warn,#f0883e)}
    text{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
    @media (prefers-color-scheme: light){
      .bg{fill:var(--diagram-bg,#f6f8fa)} .panel{fill:var(--diagram-panel,#ffffff)}
      .panel2{fill:var(--diagram-panel2,#f0f3f6)}
      .ln{stroke:var(--diagram-line,#d0d7de)}
      .t{fill:var(--diagram-ink,#1f2328)} .m{fill:var(--diagram-ink2,#59636e)}
      .dim{fill:var(--diagram-ink3,#818b98)}
      .acc{fill:var(--diagram-acc,#0969da)} .accs{stroke:var(--diagram-acc,#0969da)}
      .bad{fill:var(--diagram-bad,#cf222e)} .bads{stroke:var(--diagram-bad,#cf222e)}
      .ok{fill:var(--diagram-ok,#1a7f37)} .oks{stroke:var(--diagram-ok,#1a7f37)}
      .warn{fill:var(--diagram-warn,#bc4c00)}
    }
  </style>
  <rect class="bg" width="1200" height="675"/>

  <text class="sans t" x="60" y="66" font-size="28" font-weight="600">Answer on the device, in the user's language</text>
  <text class="m" x="60" y="98" font-size="15">No network round trip, because the people who need this are often standing somewhere with no signal.</text>

  <!-- phone -->
  <rect class="panel ln" x="120" y="136" width="300" height="500" rx="34" stroke-width="1.5"/>
  <rect class="panel2" x="136" y="176" width="268" height="380" rx="10"/>
  <rect class="dim" x="232" y="152" width="76" height="8" rx="4" opacity="0.5"/>

  <!-- camera view: a bottle -->
  <g opacity="0.9">
    <path class="oks" d="M256 268 h28 v-22 h-28 z" stroke-width="2"/>
    <path class="oks" d="M248 268 q22 -6 44 0 l6 128 q-28 10 -56 0 z" stroke-width="2"/>
    <path class="oks" d="M250 320 h40" stroke-width="1.5" stroke-dasharray="4 4"/>
  </g>
  <rect class="oks" x="222" y="230" width="96" height="184" rx="8" stroke-width="2" stroke-dasharray="10 7"/>
  <text class="ok" x="270" y="222" font-size="13" text-anchor="middle">PET bottle · 0.94</text>

  <rect class="panel oks" x="152" y="440" width="236" height="98" rx="12" stroke-width="2"/>
  <text class="ok" x="172" y="472" font-size="17">Dry waste</text>
  <text class="t" x="172" y="498" font-size="14">Rinse it, then blue bin</text>
  <text class="m" x="172" y="522" font-size="13">"सूखा कचरा, नीले डिब्बे में"</text>

  <circle class="ln" cx="270" cy="592" r="20" stroke-width="2"/>

  <!-- right column -->
  <text class="m" x="500" y="182" font-size="13" letter-spacing="2">WHAT IT REFUSES TO GUESS</text>
  <rect class="panel bads" x="500" y="200" width="620" height="76" rx="12" stroke-width="1.5"/>
  <text class="bad" x="524" y="230" font-size="16">Battery detected</text>
  <text class="t" x="524" y="256" font-size="14">Hazardous. Not any bin. Take it to a collection point.</text>

  <text class="m" x="500" y="326" font-size="13" letter-spacing="2">WHEN IT IS UNSURE</text>
  <rect class="panel ln" x="500" y="344" width="620" height="76" rx="12" stroke-width="1"/>
  <text class="warn" x="524" y="374" font-size="16">Confidence 0.41</text>
  <text class="t" x="524" y="400" font-size="14">Asks for a clearer angle rather than inventing a bin.</text>

  <text class="m" x="500" y="470" font-size="13" letter-spacing="2">WHEN YOU CORRECT IT</text>
  <rect class="panel oks" x="500" y="488" width="620" height="76" rx="12" stroke-width="1.5"/>
  <text class="ok" x="524" y="518" font-size="16">Correction stored locally</text>
  <text class="t" x="524" y="544" font-size="14">Weighted on this phone. It never leaves the device.</text>

  <text class="dim" x="500" y="612" font-size="13">Which is right for privacy and wrong for improving the model for anyone else.</text>

</svg>

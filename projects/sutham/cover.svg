<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Sutham">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="hsl(194,42%,17%)"/>
      <stop offset="55%" stop-color="hsl(242,38%,11%)"/>
      <stop offset="100%" stop-color="hsl(134,34%,8%)"/>
    </linearGradient>
    <radialGradient id="glow" cx="20%" cy="16%" r="72%">
      <stop offset="0%" stop-color="hsl(194,76%,60%)" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="hsl(194,76%,60%)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="88%" cy="88%" r="64%">
      <stop offset="0%" stop-color="hsl(134,72%,62%)" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="hsl(134,72%,62%)" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0 L0 0 0 48" fill="none" stroke="#fff" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <rect width="1200" height="675" fill="url(#glow)"/>
  <rect width="1200" height="675" fill="url(#glow2)"/>
  <g fill="none" stroke="#fff" stroke-opacity="0.14" stroke-width="1.5">
    <path d="M-40 520 C 260 470, 420 300, 760 300 S 1120 190, 1260 130"/>
    <path d="M-40 590 C 280 550, 460 380, 800 380 S 1140 270, 1260 210"/>
  </g>

  <!-- a wash behind the text so the title stays legible over any hue -->
  <rect y="300" width="1200" height="375" fill="url(#scrim)"/>
  <defs>
    <linearGradient id="scrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <text x="70" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21"
        letter-spacing="4" fill="#fff" fill-opacity="0.62">HACKATHON BUILD</text>

  <text x="70" y="560" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="58" font-weight="650" letter-spacing="-1.6" fill="#fff"><tspan x="70" dy="0">Sutham</tspan></text>
</svg>
